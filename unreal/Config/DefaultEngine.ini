GameName=Try_GLB_Put_Into

; N01: Null 局域网会话基础 —— 本地身份自动登录，4 人 Listen Server 房主权威
[OnlineSubsystem]
DefaultPlatformService=Null

[OnlineSubsystemNull]
bAutoLoginAtStartup=True

; P0-1: 连接层四人上限（房主计入总人数）。
; 实测结论（UE 5.8.2）：
; - AGameSession::MaxPlayers 是 globalconfig（BaseGame.ini 默认 16），项目级 [/Script/Engine.GameSession]
;   声明不足以单独生效（实测仍取 16），仅作默认值记录；
; - AGameModeBase::GameSessionClass 不是 config 属性，[/Script/Engine.GameModeBase] 段无效；
; - 地图 Lvl_ThirdPerson 的 WorldSettings.DefaultGameMode（资产内）优先于 GlobalDefaultGameMode，
;   因此 ini 层无法注入 GameSessionClass；
; - OnPostWorldInitialization 时 GameSession 可能尚未 spawn，同步强制不可靠。
; 最终实现：UNetSessionSubsystem 在新世界后启动短周期定时器（EnforceGameSessionCapacity），
; GameSession 就绪即强制 MaxPlayers=4（早于任何客户端 Login），连接层拒绝路径为
; AGameSession::ApproveLogin -> AtCapacity -> "Server full."（引擎日志），
; 子系统日志标记 CAPACITY / CAPACITY_FORCED。
[/Script/Engine.GameSession]
MaxPlayers=4

[/Script/OnlineSubsystemUtils.IpNetDriver]
InitialConnectTimeout=120.0
ConnectionTimeout=120.0
ResolutionConnectionTimeout=120.0

